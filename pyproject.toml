[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-unlocker-pro"
version = "1.1.0"
description = "Batch decryption for password-protected PDFs, with a desktop UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

# Upper bounds are deliberate. pikepdf.Pdf.save() omitting encryption by
# default is what performs the decryption, so a major bump is a behaviour
# change that must be verified by the test suite before it is adopted.
dependencies = [
    "pikepdf>=10.2,<11",
    "keyring>=25.7,<26",
    "platformdirs>=4.3,<5",
    "customtkinter>=5.2,<6",
    "tkinterdnd2>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.gui-scripts]
pdf-unlocker = "pdf_unlocker.app:main"

[tool.setuptools.packages.find]
include = ["pdf_unlocker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
